name: Build Source Docker Image

on:
  workflow_dispatch:

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: ghcr.io/${{ github.actor }}/music_tag_web

jobs:
  build:
    name: Build source image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login $GHCR_REGISTRY -u ${{ github.actor }} --password-stdin

      - name: Build and push source image
        run: |
          docker buildx build \
            --file compose/prod/django/Dockerfile \
            --build-arg BUILD_ENVIRONMENT=local \
            --tag $GHCR_IMAGE:latest \
            --tag $GHCR_IMAGE:${{ github.sha }} \
            --push \
            .
